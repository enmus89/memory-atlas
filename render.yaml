# Render Blueprint. In Render: New -> Blueprint, point it at this repo, and it
# reads this file instead of you filling in a form.
#
# The three secrets below are marked `sync: false`, which means Render prompts
# you for them on first deploy and never stores them in the repo.
#
# NOTE: the VITE_* values are read by Vite during `npm run build`, not at run
# time, so changing one requires a fresh deploy — restarting the service will
# not pick it up.

services:
  - type: web
    name: memory-atlas
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      # Supabase project URL — the base URL, with no /rest/v1 suffix.
      - key: VITE_SUPABASE_URL
        sync: false

      # The browser-safe publishable key (sb_publishable_...).
      # Never the secret key: it would bypass row level security.
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

      # Optional. Omit to run without the AI writing features.
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.6-flash

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Atlas - Interactive World Map & Travel Diary</title>
    <meta name="description" content="A personal 3D memory atlas and travel diary of the world to record visited countries, photos, stories, and journeys." />
    <meta property="og:title" content="Memory Atlas - Interactive World Map & Travel Diary" />

    <!-- Installable to the home screen. The manifest paths are relative, so the

    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon-180.png" />
    <!-- iOS ignores the manifest for these two. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body class="bg-[#f8f9fa] text-[#1a1a1a] font-sans antialiased selection:bg-blue-500/20 selection:text-blue-900">
